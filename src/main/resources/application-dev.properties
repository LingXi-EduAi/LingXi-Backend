# 开发环境配置
# 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/lx?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&autoReconnect=true&autoReconnectForPools=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

# 连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# Redis配置
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.timeout=3000
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=2000

# 阿里云短信配置（从环境变量读取）
aliyun.sms.accessKeyId=${ALIYUN_SMS_ACCESS_KEY_ID:}
aliyun.sms.accessKeySecret=${ALIYUN_SMS_ACCESS_KEY_SECRET:}
aliyun.sms.signName=${ALIYUN_SMS_SIGN_NAME:灵犀}
aliyun.sms.templateCode=${ALIYUN_SMS_TEMPLATE_CODE:SMS_478995206}

# 文件上传配置
FILE_PATH_UPLOAD=${FILE_UPLOAD_PATH:D:/uploadFilesTest/file/}

# 服务器配置
SERVER_PATH=${SERVER_BASE_URL:http://localhost:5678/}

# API配置
api.key=${API_KEY:}

# 日志配置
logging.level.com.lxe.lx=DEBUG
logging.level.org.springframework.web=DEBUG
