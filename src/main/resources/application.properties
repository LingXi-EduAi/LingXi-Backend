# 应用服务 WEB 访问端口
server.port=5678
# 本地开发时自动读取项目根目录的 .env；生产环境仍可直接注入系统环境变量
spring.config.import=optional:file:.env[.properties]
# THYMELEAF (ThymeleafAutoConfiguration)
# 开启模板缓存（默认值： true ）
spring.thymeleaf.cache=true
# 检查模板是否存在，然后再呈现
spring.thymeleaf.check-template=true
# 检查模板位置是否正确（默认值 :true ）
spring.thymeleaf.check-template-location=true
#Content-Type 的值（默认值： text/html ）
spring.thymeleaf.content-type=text/html
# 开启 MVC Thymeleaf 视图解析（默认值： true ）
spring.thymeleaf.enabled=true
# 模板编码
spring.thymeleaf.encoding=UTF-8
# 要被排除在解析之外的视图名称列表，⽤逗号分隔
spring.thymeleaf.excluded-view-names=
# 要运⽤于模板之上的模板模式。另⻅ StandardTemplate-ModeHandlers( 默认值： HTML5)
spring.thymeleaf.mode=HTML5
# 在构建 URL 时添加到视图名称前的前缀（默认值： classpath:/templates/ ）
spring.thymeleaf.prefix=classpath:/templates/
# 在构建 URL 时添加到视图名称后的后缀（默认值： .html ）
spring.thymeleaf.suffix=.html

# ===== 敏感配置通过环境变量注入，本地请在 .env 文件中配置 =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#云数据库
spring.mvc.servlet.load-on-startup=1
mybatis.mapper-locations=classpath:mybatis/*.xml

#192.168.1.40
#SERVER_PATH=http://192.168.1.40:5678/
SERVER_PATH=http://localhost:5678

#本机测试地址
#FILE_PATH = D:/uploadFilesTest/wordExcel/WORDS.xlsx
#FILE_PATH_UPLOAD = D:/uploadFilesTest/file/

# Redis 配置
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=3000
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=2000


aliyun.sms.accessKeyId=${ALIYUN_SMS_ACCESS_KEY_ID}
aliyun.sms.accessKeySecret=${ALIYUN_SMS_ACCESS_KEY_SECRET}
aliyun.sms.signName=灵犀
aliyun.sms.templateCode=SMS_478995206


#本机测试地址
#FILE_PATH = D:/uploadFilesTest/wordExcel/WORDS.xlsx
FILE_PATH_UPLOAD = D:/uploadFilesTest/file/



spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 旧版 Dify 应用（通过 DifyGateway 兼容调用）
api.base-url=${API_BASE_URL}
api.key=${API_KEY}

# Dify Chatflow / Workflow API（不同应用使用独立地址和 API Key）
dify.chatflow.base-url=${DIFY_CHATFLOW_BASE_URL}
dify.chatflow.api-key=${DIFY_CHATFLOW_API_KEY}
dify.workflow.base-url=${DIFY_WORKFLOW_BASE_URL:}
dify.workflow.api-key=${DIFY_WORKFLOW_API_KEY:}
dify.workflow.connect-timeout-ms=${DIFY_CONNECT_TIMEOUT_MS:5000}
dify.workflow.read-timeout-ms=${DIFY_READ_TIMEOUT_MS:120000}
dify.stream.connect-timeout-ms=${DIFY_STREAM_CONNECT_TIMEOUT_MS:${DIFY_CONNECT_TIMEOUT_MS:5000}}
dify.stream.read-timeout-ms=${DIFY_STREAM_READ_TIMEOUT_MS:0}

# AI SSE 连接超时与心跳间隔
ai.sse.timeout-ms=${AI_SSE_TIMEOUT_MS:600000}
ai.sse.heartbeat-ms=${AI_SSE_HEARTBEAT_MS:15000}

# AI 持久化任务执行线程池（首版单实例）
ai.task.executor.core-size=${AI_TASK_EXECUTOR_CORE_SIZE:4}
ai.task.executor.max-size=${AI_TASK_EXECUTOR_MAX_SIZE:8}
ai.task.executor.queue-capacity=${AI_TASK_EXECUTOR_QUEUE_CAPACITY:100}
ai.task.recovery-enabled=${AI_TASK_RECOVERY_ENABLED:true}



