# 生产环境配置
# 数据库配置（从环境变量读取）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 连接池配置
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# Redis配置
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=0
spring.redis.timeout=5000
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5
spring.redis.lettuce.pool.max-wait=3000

# 阿里云短信配置
aliyun.sms.accessKeyId=${ALIYUN_SMS_ACCESS_KEY_ID}
aliyun.sms.accessKeySecret=${ALIYUN_SMS_ACCESS_KEY_SECRET}
aliyun.sms.signName=${ALIYUN_SMS_SIGN_NAME}
aliyun.sms.templateCode=${ALIYUN_SMS_TEMPLATE_CODE}

# 文件上传配置
FILE_PATH_UPLOAD=${FILE_UPLOAD_PATH:/var/www/uploads/}

# 服务器配置
SERVER_PATH=${SERVER_BASE_URL}

# API配置
api.key=${API_KEY}

# 安全配置
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}

# 日志配置
logging.level.com.lxe.lx=INFO
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# 性能监控
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
